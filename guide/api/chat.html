<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawdBot - Test Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-image {
            max-width: 300px;
            border-radius: 10px;
            margin-top: 8px;
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
            max-height: 100px;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .send-button, .image-button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-button:hover, .image-button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .send-button:active, .image-button:active {
            transform: scale(0.95);
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            margin-left: 10px;
        }

        .typing-indicator.active {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .file-input {
            display: none;
        }

        .image-preview {
            max-width: 200px;
            margin: 10px 0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 ClawdBot</h1>
            <p>AI Work Assistant - Test Environment</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message bot">
                <div class="message-bubble">
                    👋 Hi! I'm ClawdBot, your AI work assistant.<br><br>
                    I can help you with:<br>
                    • Send a photo - I'll analyze it and guide you<br>
                    • Tell me what you're working on<br>
                    • Ask questions - Get expert advice<br><br>
                    What are you working on?
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <div class="typing-indicator" id="typing">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
            <div class="chat-input-wrapper">
                <button class="image-button" onclick="document.getElementById('imageInput').click()" title="Send image">
                    📷
                </button>
                <input type="file" id="imageInput" class="file-input" accept="image/*">
                <textarea
                    class="chat-input"
                    id="messageInput"
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
                <button class="send-button" onclick="sendMessage()">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const typingIndicator = document.getElementById('typing');
        const imageInput = document.getElementById('imageInput');

        let selectedImage = null;

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // Send on Enter (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Handle image selection
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedImage = {
                        data: event.target.result,
                        file: file
                    };
                    // Show preview in input area
                    addImagePreview(event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        function addImagePreview(imageSrc) {
            const preview = document.createElement('img');
            preview.src = imageSrc;
            preview.className = 'image-preview';
            preview.onclick = () => {
                selectedImage = null;
                preview.remove();
            };
            messageInput.parentElement.insertBefore(preview, messageInput);
        }

        function addMessage(text, isUser, imageData = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            if (imageData) {
                const img = document.createElement('img');
                img.src = imageData;
                img.className = 'message-image';
                bubble.appendChild(img);
            }

            messageDiv.appendChild(bubble);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();

            if (!text && !selectedImage) return;

            // Add user message
            addMessage(text || '📷 Sent image', true, selectedImage?.data);

            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Show typing indicator
            typingIndicator.classList.add('active');

            try {
                // Prepare request
                const formData = new FormData();
                formData.append('text', text);
                formData.append('sender_id', 'web-test-user');

                if (selectedImage) {
                    formData.append('image', selectedImage.file);
                }

                // Send to backend
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Hide typing indicator
                typingIndicator.classList.remove('active');

                // Add bot response
                addMessage(data.message, false);

            } catch (error) {
                console.error('Error:', error);
                typingIndicator.classList.remove('active');
                addMessage('Sorry, I encountered an error. Please try again.', false);
            }

            // Clear selected image
            selectedImage = null;
            const previews = document.querySelectorAll('.image-preview');
            previews.forEach(p => p.remove());
        }
    </script>
</body>
</html>
